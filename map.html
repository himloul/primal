<html>
<head>
<meta name="viewport" content="initial-scale=1.0, user-scalable=no" />
<meta http-equiv="content-type" content="text/html; charset=UTF-8" />
<title>Google Maps - gmplot</title>
<script type="text/javascript" src="https://maps.googleapis.com/maps/api/js?libraries=visualization&key=AIzaSyA2KJIwDsDNnjBOzQUdqn_6TVyE2DHbscM"></script>
<script type="text/javascript">
    function initialize() {
        var map = new google.maps.Map(document.getElementById("map_canvas"), {
            zoom: 11,
            center: new google.maps.LatLng(35.911079, 14.405030)
        });

        new google.maps.Polygon({
            clickable: false,
            geodesic: true,
            fillColor: "#FFFFFF",
            fillOpacity: 0.300000,
            strokeColor: "#FF0000",
            strokeOpacity: 1.000000,
            strokeWeight: 4,
            map: map,
            paths: [
                new google.maps.LatLng(35.803328, 14.554822),
                new google.maps.LatLng(35.800475, 14.496695),
                new google.maps.LatLng(35.825082, 14.398712),
                new google.maps.LatLng(35.868734, 14.326598),
                new google.maps.LatLng(35.973936, 14.290459),
                new google.maps.LatLng(36.004854, 14.266097),
                new google.maps.LatLng(36.030803, 14.177367),
                new google.maps.LatLng(36.087915, 14.176825),
                new google.maps.LatLng(36.096223, 14.259044),
                new google.maps.LatLng(36.054412, 14.353785),
                new google.maps.LatLng(35.882201, 14.593547),
                new google.maps.LatLng(35.828978, 14.586117),
            ]
        });

        new google.maps.DirectionsService().route({
            origin: new google.maps.LatLng(35.851583, 14.497483),
            destination: new google.maps.LatLng(35.917809, 14.499172),
            waypoints: [
                {location: new google.maps.LatLng(35.852853, 14.486711), stopover: false},
                {location: new google.maps.LatLng(35.826590, 14.436526), stopover: false},
                {location: new google.maps.LatLng(35.826590, 14.436526), stopover: false},
                {location: new google.maps.LatLng(35.848180, 14.502401), stopover: false},
                {location: new google.maps.LatLng(35.833129, 14.562119), stopover: false},
                {location: new google.maps.LatLng(35.843530, 14.560130), stopover: false},
                {location: new google.maps.LatLng(35.855856, 14.558358), stopover: false},
                {location: new google.maps.LatLng(35.907822, 14.476925), stopover: false},
            ],
            travelMode: "DRIVING"
        }, function(response, status) {
            if (status == google.maps.DirectionsStatus.OK) {
                new google.maps.DirectionsRenderer({map: map}).setDirections(response);
            }
        });

        new google.maps.Marker({
            label: {
                text: "Start",
                color: "#008000",
                fontWeight: "bold"
            },
            icon: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABAQMAAAAl21bKAAAAA1BMVEX/TQBcNTh/AAAAAXRSTlMAQObYZgAAAApJREFUeJxjYgAAAAYAAzY3fKgAAAAASUVORK5CYII=",
            position: new google.maps.LatLng(35.852853, 14.486711),
            map: map
        });

        new google.maps.Marker({
            label: {
                text: "End",
                color: "#FF0000",
                fontWeight: "bold"
            },
            icon: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABAQMAAAAl21bKAAAAA1BMVEX/TQBcNTh/AAAAAXRSTlMAQObYZgAAAApJREFUeJxjYgAAAAYAAzY3fKgAAAAASUVORK5CYII=",
            position: new google.maps.LatLng(35.833129, 14.562119),
            map: map
        });

        new google.maps.Marker({
            label: {
                text: "Start",
                color: "#008000",
                fontWeight: "bold"
            },
            icon: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABAQMAAAAl21bKAAAAA1BMVEX/TQBcNTh/AAAAAXRSTlMAQObYZgAAAApJREFUeJxjYgAAAAYAAzY3fKgAAAAASUVORK5CYII=",
            position: new google.maps.LatLng(35.843530, 14.560130),
            map: map
        });

        new google.maps.Marker({
            label: {
                text: "End",
                color: "#FF0000",
                fontWeight: "bold"
            },
            icon: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABAQMAAAAl21bKAAAAA1BMVEX/TQBcNTh/AAAAAXRSTlMAQObYZgAAAApJREFUeJxjYgAAAAYAAzY3fKgAAAAASUVORK5CYII=",
            position: new google.maps.LatLng(35.855856, 14.558358),
            map: map
        });

        new google.maps.Marker({
            label: {
                text: "Start",
                color: "#008000",
                fontWeight: "bold"
            },
            icon: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABAQMAAAAl21bKAAAAA1BMVEX/TQBcNTh/AAAAAXRSTlMAQObYZgAAAApJREFUeJxjYgAAAAYAAzY3fKgAAAAASUVORK5CYII=",
            position: new google.maps.LatLng(35.826590, 14.436526),
            map: map
        });

        new google.maps.Marker({
            label: {
                text: "End",
                color: "#FF0000",
                fontWeight: "bold"
            },
            icon: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABAQMAAAAl21bKAAAAA1BMVEX/TQBcNTh/AAAAAXRSTlMAQObYZgAAAApJREFUeJxjYgAAAAYAAzY3fKgAAAAASUVORK5CYII=",
            position: new google.maps.LatLng(35.848180, 14.502401),
            map: map
        });

        new google.maps.Marker({
            label: {
                text: "Start",
                color: "#008000",
                fontWeight: "bold"
            },
            icon: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABAQMAAAAl21bKAAAAA1BMVEX/TQBcNTh/AAAAAXRSTlMAQObYZgAAAApJREFUeJxjYgAAAAYAAzY3fKgAAAAASUVORK5CYII=",
            position: new google.maps.LatLng(35.907822, 14.476925),
            map: map
        });

        new google.maps.Marker({
            label: {
                text: "End",
                color: "#FF0000",
                fontWeight: "bold"
            },
            icon: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABAQMAAAAl21bKAAAAA1BMVEX/TQBcNTh/AAAAAXRSTlMAQObYZgAAAApJREFUeJxjYgAAAAYAAzY3fKgAAAAASUVORK5CYII=",
            position: new google.maps.LatLng(35.917809, 14.499172),
            map: map
        });

    }
</script>
</head>
<body style="margin:0px; padding:0px;" onload="initialize()">
    <div id="map_canvas" style="width: 100%; height: 100%;" />
</body>
</html>
